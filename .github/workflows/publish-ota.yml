name: Publish LinkedOut OTA Update

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "hooks/**"
      - "lib/**"
      - "global.css"
      - "assets/**"
  workflow_dispatch:
    inputs:
      message:
        description: "Release note shown in EAS"
        required: false
        default: "Manual LinkedOut OTA update"
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install web dependencies
        run: npm ci --prefix web --legacy-peer-deps

      - name: Typecheck
        run: pnpm check

      - name: Configure EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publish preview OTA update
        env:
          RELEASE_MESSAGE: ${{ inputs.message }}
        run: |
          message="$RELEASE_MESSAGE"
          if [ -z "$message" ]; then
            message="LinkedOut OTA update ${GITHUB_SHA::7}"
          fi
          eas update --channel preview --message "$message" --non-interactive
